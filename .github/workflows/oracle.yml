name: oracle
on:
  push:
  pull_request:
jobs:
  go-oracle-leaf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go test ./internal/oracle
      - run: go run ./cmd/weasis-dump dump slice-position --iop 1,0,0,0,1,0 --ipp 0,0,10
      - run: go run ./cmd/weasis-dump dump sort-key
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pydicom
      - run: python3 scripts/generate-phantom-ct.py
      - run: python3 scripts/generate-corpus-extra.py
      - run: python3 scripts/generate-iods.py
      - run: sudo apt-get update && sudo apt-get install -y dcmtk libgdcm-tools ffmpeg libjxl-tools
      - run: bash scripts/generate-codecs.sh
      - run: python3 scripts/generate-edge-023.py
      - run: python3 scripts/generate-huge-multiframe.py
      - run: python3 scripts/verify-edge-023.py
      - run: rm -f corpus/phantoms/G-P0-edge-gt2gb.dcm
      - run: python3 scripts/generate-dicomdir.py
      - run: python3 scripts/hash-corpus.py
      - run: bash scripts/second-oracle-header.sh corpus/phantoms/G-P0-phantom-ct.dcm

  java-weasis-producer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pydicom
      - run: python3 scripts/generate-phantom-ct.py
      - run: python3 scripts/generate-corpus-extra.py
      - run: python3 scripts/generate-iods.py
      - run: python3 scripts/generate-edge-023.py
      - run: bash scripts/fetch-weasis-4.7-bundles.sh
      - run: bash scripts/run-weasis-producer.sh
      - run: bash scripts/run-xml-graphics-probe.sh
